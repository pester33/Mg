name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

      - name: Report build errors (temporary)
        if: failure() && matrix.config.target == 'Android64'
        shell: bash
        run: |
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)
          rm -rf dbg
          { cmake -B dbg -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake -DANDROID_STL=c++_shared \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DGEODE_DONT_INSTALL_MODS=ON \
              -DGEODE_TARGET_PLATFORM=Android64 && cmake --build dbg; } > dbg.log 2>&1 || true
          grep -iE "error|undefined" dbg.log | sort -u | head -30 | sed 's/^/::error::/'

  package:
    name: Package builds
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - uses: actions/checkout@v4
        with:
          path: src-repo

      - name: Write version.txt (used by the in-game updater)
        run: jq -r '.version' src-repo/mod.json > "${{ steps.build.outputs.build-output }}/version.txt"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build-2.2091
          name: MG Menu (GD 2.2091)
          make_latest: true
          files: |
            ${{ steps.build.outputs.build-output }}/*.geode
            ${{ steps.build.outputs.build-output }}/version.txt
